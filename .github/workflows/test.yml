name: API Tests

on:
  push:
    branches: [ main, uat, agents, portals-dev ]
    paths:
      - 'api/**'
  pull_request:
    branches: [ main, uat, agents, portals-dev ]
    paths:
      - 'api/**'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"

    - name: Install package
      run: pip install -e ".[dev]"

    - name: Run Pytest
      run: pytest -v tests/
