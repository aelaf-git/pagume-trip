name: Backend API Tests

on:
  push:
    branches: [ main, uat, ui, portals-dev ]
    paths:
      - 'portals/backend/**'
  pull_request:
    branches: [ main, uat, ui, portals-dev ]
    paths:
      - 'portals/backend/**'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portals/backend

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.13"

    - name: Install uv
      uses: astral-sh/setup-uv@v10
      with:
        enable-cache: true

    - name: Install dependencies
      run: uv sync

    - name: Run Pytest
      run: uv run pytest -v tests/
