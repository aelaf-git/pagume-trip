name: pagume_trip_app
description: A Flutter application for Pagume Trip
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # ============================================
  # STATE MANAGEMENT
  # ============================================
  flutter_riverpod: ^2.4.0
  riverpod_annotation: ^2.3.0

  # ============================================
  # NAVIGATION (YOUR VERSION)
  # ============================================
  go_router: ^12.0.0

  # ============================================
  # SECURE STORAGE (FOR LOGIN)
  # ============================================
  flutter_secure_storage: ^9.0.0

  # ============================================
  # DATA PERSISTENCE (FOR SAVING TRIPS)
  # ============================================
  shared_preferences: ^2.2.2

  # ============================================
  # MAP & URL LAUNCHER
  # ============================================
  url_launcher: ^6.2.1

  # ============================================
  # UI & DESIGN (AELAF'S ADDITIONS)
  # ============================================
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.0
  cupertino_icons: ^1.0.6

  # ============================================
  # NETWORKING
  # ============================================
  dio: ^5.4.0
  retrofit: ^4.0.1
  logger: ^1.4.0

  # ============================================
  # WEBSOCKET
  # ============================================
  web_socket_channel: ^2.4.0
  flutter_markdown: ^0.7.7+1
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code Generation
  build_runner: ^2.4.0
  riverpod_generator: ^2.3.0
  custom_lint: ^0.6.0
  riverpod_lint: ^2.3.0
  retrofit_generator: ^7.0.0

  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/pagume_logo.png"
  adaptive_icon_background: "#0A7E3D"
  adaptive_icon_foreground: "assets/images/pagume_logo.png"
  remove_alpha_ios: true
  min_sdk_android: 21

flutter:
  uses-material-design: true

  # Assets
  assets:
    - assets/images/
    - assets/fonts/